plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName '2.1'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORACLE_KEY_ALIAS')
                keyPassword System.getenv('ORACLE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            debuggable false
            minifyEnabled false
        }
    }

    packagingOptions {
        // Known conflict with com.sun.mail:android-mail/android-activation —
        // both ship duplicate META-INF license/notice files.
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/DEPENDENCIES'
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    // Real SMTP sending (silent, no tap-to-send) via the user's own mail
    // account. Android has no built-in SMTP client, and Android's own
    // javax.activation is incomplete, hence the "android-" repackaged
    // artifacts instead of the plain javax.mail ones.
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
