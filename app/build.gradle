plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 32
        versionName '3.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORACLE_KEY_ALIAS')
                keyPassword System.getenv('ORACLE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            debuggable false
            // R8: renames classes/methods/fields to short meaningless names,
            // inlines and dead-code-strips aggressively, and drops unused
            // resources. This is what actually makes a decompiled APK show
            // "class a { fun b(c: Int) }" instead of readable Oracle source
            // — a real, meaningful barrier against casual cloning. It is not
            // a total defense: the app still has to run the logic on the
            // device, so a determined analyst with enough time can still
            // recover it from the obfuscated bytecode. Nothing client-side
            // makes that impossible; only moving the sensitive calculation
            // to the server removes it from the APK entirely.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Name the built APK "LuxOculi<versionName>.apk" (e.g. LuxOculi3.0.apk)
    // instead of Gradle's default app-release.apk — tied to versionName so
    // it can never drift from the version actually inside the APK.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "LuxOculi${variant.versionName}.apk"
        }
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    // Push notifications sent by the server (alintudor.ro) via Firebase
    // Cloud Messaging. The BOM pins a matching, tested set of Firebase
    // library versions; only firebase-messaging is actually used.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
