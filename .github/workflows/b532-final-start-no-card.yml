name: Oracle B532 FINAL Start - Rectangular NO CARD

on:
  push:
    branches: [main]
    paths:
      - B532_TRIGGER.txt
      - .github/workflows/b532-final-start-no-card.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current approved source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Make the requested Start change in the actual source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s=p.read_text()
          start=s.index('    private fun showHub() {')
          end=s.index('    private fun makeHomeCard', start)
          block='''    private fun showHub() {
        currentModule = null
        root.removeAllViews()
        val scroll = ScrollView(this).apply {
            isFillViewport = true
            setBackgroundColor(Color.rgb(1, 3, 8))
            overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
        }
        val page = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(0, 0, 0, dp(8))
            setBackgroundColor(Color.rgb(1, 2, 5))
        }
        val hero = OracleHeroView(this) { openModule(it) }
        val heroHeightPx = (resources.displayMetrics.heightPixels * .80f).toInt().coerceAtLeast(dp(620))
        page.addView(hero, LinearLayout.LayoutParams(-1, heroHeightPx))
        scroll.addView(page)
        root.addView(scroll, FrameLayout.LayoutParams(-1, -1))
    }
'''
          p.write_text(s[:start] + block + s[end:])
          PY

          MAIN='app/src/main/java/ro/alintudor/oracle/MainActivity.kt'
          grep -q 'OracleHeroView(this)' "$MAIN"
          ! grep -q 'OracleMysticStartViewV2(this)' "$MAIN"
          ! grep -q 'ORACLE READY' "$MAIN"
          ! grep -q 'LOCAL INTELLIGENCE' "$MAIN"
          git diff --check

      - name: Commit the actual source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'oracle-build'
          git config user.email 'oracle-build@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          git diff --cached --quiet || git commit -m 'B532 final: remove Start status card and keep rectangular Hero'
          git push origin HEAD:main

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Set B532 version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 50', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-START-B532'", s, count=1)
          p.write_text(s)
          PY
          grep -q 'versionCode 50' app/build.gradle
          grep -q "versionName 'V6g-START-B532'" app/build.gradle

      - name: Clean and build release APK
        run: gradle clean :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is installable and is B532
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionName='V6g-START-B532'"
          echo "$BADGING" | grep -q "versionCode='50'"
          echo "$BADGING" | grep -q "package: name='ro.alintudor.oracle'"

      - name: Upload FINAL installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B532-FINAL-START-RECTANGULAR-NO-CARD
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
