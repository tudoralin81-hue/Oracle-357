name: Lux Oculi Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare signing key (optional — used automatically once the 4 secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] \
            && [ -n "${KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks" >> "$GITHUB_ENV"
            echo "ORACLE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORACLE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORACLE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Show signing key SHA-1 (for Google Cloud API key restriction)
        if: env.ORACLE_KEYSTORE_FILE != ''
        run: |
          echo "=== SHA-1 fingerprint — paste this into Google Cloud Console ==="
          keytool -list -v \
            -keystore "$ORACLE_KEYSTORE_FILE" \
            -alias "$ORACLE_KEY_ALIAS" \
            -storepass "$ORACLE_KEYSTORE_PASSWORD" \
            2>/dev/null | grep "SHA1:"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxOculi-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
