name: Oracle B540 Growth Rollback Performance
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze protected modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          for f in app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/before
      - name: Restore known-working Growth toggle and accelerate engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Restore the exact known-working toggle architecture from B537/B538:
          # the container 'rows' stays visible; only older row Views are toggled.
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          start=s.index('    private fun addHistory(')
          marker=s.index('    private fun historyRow', start)
          new=r'''    private fun addHistory(entries: List<OracleGrowthRecommendation>) {
              val card = card(12)
              val header = LinearLayout(host.root.context).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
              }
              val title = text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0)
              header.addView(title, LinearLayout.LayoutParams(-2, -2))
              val arrow = TextView(host.root.context).apply {
                  text = "⌄"
                  textSize = 23f
                  typeface = Typeface.DEFAULT_BOLD
                  gravity = Gravity.CENTER
                  setTextColor(cyan)
                  setPadding(host.dp(4), 0, host.dp(8), host.dp(2))
                  isClickable = true
                  isFocusable = true
                  contentDescription = "Extinde sau restrânge ultimele recomandări"
              }
              header.addView(arrow, LinearLayout.LayoutParams(host.dp(38), host.dp(40)))
              val download = TextView(host.root.context).apply {
                  text = "⇩  PDF"
                  textSize = 11f
                  typeface = Typeface.DEFAULT_BOLD
                  gravity = Gravity.CENTER
                  setTextColor(Color.WHITE)
                  background = rounded(Color.rgb(8, 15, 28), cyan, 1, 10)
                  setPadding(host.dp(13), host.dp(8), host.dp(13), host.dp(8))
                  isClickable = true
                  isFocusable = true
                  contentDescription = "Descarcă jurnalul Growth în PDF"
                  setOnClickListener {
                      val path = journalStore.exportPdf()
                      if (path != null) Toast.makeText(host.root.context, "Jurnalul Growth a fost salvat în Downloads.", Toast.LENGTH_LONG).show()
                      else Toast.makeText(host.root.context, "Nu există recomandări pentru export.", Toast.LENGTH_SHORT).show()
                  }
              }
              header.addView(download, LinearLayout.LayoutParams(host.dp(94), host.dp(40)))
              card.addView(header)

              val all = entries
                  .filter { it.referenceTimestamp > 0L && it.referenceTimestamp >= startHistoryTimestamp() }
                  .sortedWith(compareByDescending<OracleGrowthRecommendation> { it.referenceTimestamp }
                      .thenBy { horizonOrder(it.horizon) }.thenBy { it.ticker })
              val rows = LinearLayout(host.root.context).apply { orientation = LinearLayout.VERTICAL }
              card.addView(rows)

              fun addPlaceholder() {
                  val row = historyRow(null, "31.08.2026 16:00")
                  rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })
              }
              fun addEntry(item: OracleGrowthRecommendation) {
                  val row = historyRow(item)
                  rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })
              }

              val visible = all.take(6)
              visible.forEach { addEntry(it) }
              repeat(maxOf(0, 6 - visible.size)) { addPlaceholder() }

              val expandedViews = all.drop(6).map { item ->
                  val row = historyRow(item)
                  row.visibility = View.GONE
                  rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })
                  row
              }
              var expanded = false
              fun applyHistoryVisibility() {
                  expandedViews.forEach { view -> view.visibility = if (expanded) View.VISIBLE else View.GONE }
                  arrow.text = if (expanded) "⌃" else "⌄"
                  arrow.contentDescription = if (expanded) "Restrânge ultimele recomandări" else "Extinde ultimele recomandări"
              }
              arrow.setOnClickListener {
                  expanded = !expanded
                  applyHistoryVisibility()
              }
              title.setOnClickListener {
                  expanded = !expanded
                  applyHistoryVisibility()
              }
              applyHistoryVisibility()
              host.content.addView(card, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, host.dp(10)) })
          }

          s=s[:start]+new+'\n\n'+s[marker:]
          p.write_text(s,encoding='utf-8')

          # 2) Parallelize the expensive OHLCV universe fetch. The old code made
          # hundreds of Yahoo requests strictly one-by-one, causing multi-minute startup.
          p=Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt')
          s=p.read_text(encoding='utf-8')
          if 'java.util.concurrent.Executors' not in s:
              s=s.replace('import java.util.Locale\n', 'import java.util.Locale\nimport java.util.concurrent.Executors\nimport java.util.concurrent.TimeUnit\n')
          old='''        val candidates=mutableListOf<C>()
        for(ticker in universe.distinct()){val candles=OracleMarketData.fetchDaily(ticker,"1y");if(candles.size<60)continue;evaluate(ticker,candles)?.let{candidates+=it}}'''
          new='''        val candidates=mutableListOf<C>()
        val universeTickers=universe.distinct()
        val marketPool=Executors.newFixedThreadPool(6)
        try {
            val futures=universeTickers.map { ticker -> marketPool.submit<Pair<String,List<OracleOhlcvPoint>>> { ticker to OracleMarketData.fetchDaily(ticker,"1y") } }
            futures.forEach { future ->
                runCatching { future.get(18, TimeUnit.SECONDS) }.getOrNull()?.let { (ticker,candles) ->
                    if(candles.size>=60) evaluate(ticker,candles)?.let { candidates+=it }
                }
            }
        } finally { marketPool.shutdownNow() }'''
          if old not in s: raise SystemExit('market loop not found')
          s=s.replace(old,new,1)

          # 3) Parallelize the real-data enrichment too; fundamentals currently
          # performs multiple Yahoo calls per ticker and was another large delay.
          old='''        val technicalShortlist=candidates.sortedByDescending{it.score}.take(30)
        val fundamentals=technicalShortlist.associate { c ->
            c.ticker to runCatching { OracleRealData.fundamentals(c.ticker) }.getOrNull()
        }'''
          new='''        val technicalShortlist=candidates.sortedByDescending{it.score}.take(30)
        val enrichmentPool=Executors.newFixedThreadPool(6)
        val fundamentals=try {
            val fs=technicalShortlist.map { c -> enrichmentPool.submit<Pair<String,OracleFundamentals?>> { c.ticker to runCatching { OracleRealData.fundamentals(c.ticker) }.getOrNull() } }
            fs.mapNotNull { runCatching { it.get(18, TimeUnit.SECONDS) }.getOrNull() }.toMap()
        } finally { enrichmentPool.shutdownNow() }'''
          if old not in s: raise SystemExit('fundamentals block not found')
          s=s.replace(old,new,1)

          # 4) News enrichment is also parallelized, but bounded.
          old='''        val newsCandidates=technicalShortlist.take(15)
        for(c in newsCandidates){
            newsContexts[c.ticker]=runCatching { OracleRealData.newsContext(c.ticker) }.getOrDefault(OracleNewsContext(50,0,0,0,null))
        }'''
          new='''        val newsCandidates=technicalShortlist.take(15)
        val newsPool=Executors.newFixedThreadPool(6)
        try {
            val ns=newsCandidates.map { c -> newsPool.submit<Pair<String,OracleNewsContext>> { c.ticker to runCatching { OracleRealData.newsContext(c.ticker) }.getOrDefault(OracleNewsContext(50,0,0,0,null)) } }
            ns.forEach { runCatching { it.get(12, TimeUnit.SECONDS) }.getOrNull()?.let { (ticker,ctx) -> newsContexts[ticker]=ctx } }
        } finally { newsPool.shutdownNow() }'''
          if old not in s: raise SystemExit('news block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'var expanded = false' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'expandedViews.forEach { view -> view.visibility = if (expanded) View.VISIBLE else View.GONE }' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'Executors.newFixedThreadPool(6)' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          git diff --check
      - name: Set B540 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+', 'versionCode 35', s, count=1)
          s=re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]', "versionName 'V6g-GROWTH-B540'", s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and frozen modules
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='V6g-GROWTH-B540'"
          for f in app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/after
          cmp /tmp/oracle-freeze/before /tmp/oracle-freeze/after
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B540-GROWTH-ROLLBACK-PERFORMANCE
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
