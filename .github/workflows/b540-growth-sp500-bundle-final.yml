name: Oracle B540 Growth S&P500 Bundle Final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact frozen protected files
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 3eb9b3284c24f94cf8126dd9916b615038664ae8
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do
            git checkout 3eb9b3284c24f94cf8126dd9916b615038664ae8 -- "$f"
          done
      - name: Apply existing B540 GROWTH performance patches
        run: |
          set -euo pipefail
          python3 scripts/b540_growth_1200_build.py
          python3 scripts/b540_growth_spark_fix.py
          python3 scripts/b540_sp500_bundle.py
          python3 scripts/b540_sp500_runtime_bundle_patch.py
          python3 scripts/b540_growth_perf_fix.py
          python3 scripts/b540_growth_loader_runtime_fix.py
          # IMPORTANT: the approved loader + 45s budget + history toggle is applied LAST.
          python3 scripts/b540_growth_history_toggle.py
          git diff --check
      - name: Set B540 identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle');s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 35',s,count=1)
          s=re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]',"versionName 'V6g-GROWTH-B540'",s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and frozen modules
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionCode='35'"
          echo "$BADGING" | grep -q "versionName='V6g-GROWTH-B540'"
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/frozen-after
          grep -q 'TARGET_UNIVERSE_SIZE=500' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'fetchDailyBatch' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'OracleSp500Universe.symbols' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'newFixedThreadPool(12)' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'DATE ÎNCĂRCATE: $pct%' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'Maxim țintă: 45 secunde' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'allRows.drop(6)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          test -f app/src/main/java/ro/alintudor/oracle/core/OracleSP500Universe.kt || test -f app/src/main/java/ro/alintudor/oracle/core/OracleSp500Universe.kt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B540-GROWTH-FINAL
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
