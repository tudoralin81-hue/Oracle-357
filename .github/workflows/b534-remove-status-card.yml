name: B534 START NO STATUS CARD

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/b534-remove-status-card.yml
      - app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
      - app/build.gradle
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Remove active Canvas status card
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import kotlin.math.abs\n', '')
          s = s.replace('; drawStatus(c,wide,time)', '')
          start = s.find('    private fun drawStatus(')
          end = s.find('    private fun miniEye(', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end:]
          s = s.replace('    private fun textLeft(c:Canvas,s:String,x:Float,y:Float,size:Float,color:Int,typeface:Typeface){p.style=Paint.Style.FILL;p.color=color;p.alpha=255;p.textSize=size;p.typeface=typeface;p.textAlign=Paint.Align.LEFT;p.letterSpacing=.01f;c.drawText(s,x,y,p)}\n', '')
          p.write_text(s, encoding='utf-8')
          PY
          ! grep -q 'drawStatus' app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
          ! grep -q 'Market Intelligence Active' app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
          ! grep -q 'Synced & Protected' app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
          grep -q 'class OracleMysticStartView' app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
          git diff --check

      - name: Persist source fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt; then
            git add app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
            git commit -m 'B534 remove active Start status card [skip ci]'
            git push origin HEAD:main
          fi

      - name: Freeze protected modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          for f in \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt; do
            test -f "$f"
            git hash-object "$f"
          done > /tmp/oracle-freeze/protected.sha

      - name: Set B534 package identity for this build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'versionCode\s+\d+', 'versionCode 36', s, count=1)
          s = re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]', "versionName 'V6g-FINAL-B534-NO-STATUS'", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "versionName 'V6g-FINAL-B534-NO-STATUS'" app/build.gradle
          grep -q 'versionCode 36' app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build B534 release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify B534 APK and protected modules
        run: |
          set -euo pipefail
          for f in \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt; do
            git hash-object "$f"
          done > /tmp/oracle-freeze/protected.after.sha
          cmp /tmp/oracle-freeze/protected.sha /tmp/oracle-freeze/protected.after.sha
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "versionName='V6g-FINAL-B534-NO-STATUS'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='36'"
          printf '%s\n' "$BADGING" | grep -q "package: name='ro.alintudor.oracle'"
          ! grep -R -q 'Market Intelligence Active' app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt
          ! grep -R -q 'Synced & Protected' app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt

      - name: Upload B534 APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B534-NO-STATUS-CARD
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
