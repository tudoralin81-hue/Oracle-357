name: Oracle B531 Final Start APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch actual Start — keep rectangular Hero and remove status card
        shell: bash
        run: python3 -c 'from pathlib import Path; p=Path("app/src/main/java/ro/alintudor/oracle/MainActivity.kt"); s=p.read_text(); a=s.index("    private fun showHub()"); b=s.index("    private fun makeHomeCard",a); block="""    private fun showHub() {\n        currentModule = null\n        root.removeAllViews()\n        val scroll = ScrollView(this).apply { isFillViewport = true; setBackgroundColor(Color.rgb(1, 3, 8)) }\n        val page = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(10), dp(6), dp(10), dp(8)); setBackgroundColor(Color.rgb(1, 2, 5)) }\n        val hero = OracleHeroView(this) { openModule(it) }\n        val heroHeightPx = (resources.displayMetrics.heightPixels * .80f).toInt().coerceAtLeast(dp(620))\n        page.addView(hero, LinearLayout.LayoutParams(-1, heroHeightPx))\n        scroll.addView(page)\n        root.addView(scroll, FrameLayout.LayoutParams(-1, -1))\n    }\n\n"""; p.write_text(s[:a]+block+s[b:])'

      - name: Verify Start source
        shell: bash
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/ro/alintudor/oracle/MainActivity.kt"
          grep -q 'OracleHeroView(this)' "$MAIN"
          ! grep -q 'OracleMysticStartViewV2(this)' "$MAIN"
          ! grep -q 'ORACLE READY' "$MAIN"
          ! grep -q 'LOCAL INTELLIGENCE' "$MAIN"
          git diff --check

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks" >> "$GITHUB_ENV"
            echo "ORACLE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORACLE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORACLE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode 49', s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-START-B531'", s, count=1)
          p.write_text(s)
          PY
          grep -q 'versionCode 49' app/build.gradle
          grep -q "versionName 'V6g-START-B531'" app/build.gradle

      - name: Clean build outputs
        run: rm -rf app/build

      - name: Build release APK
        run: gradle clean :app:assembleRelease --no-daemon --stacktrace

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionName='V6g-START-B531'"
          echo "$BADGING" | grep -q "versionCode='49'"
          echo "$BADGING" | grep -q "package: name='ro.alintudor.oracle'"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B531-START-RECTANGULAR-NO-STATUS
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
