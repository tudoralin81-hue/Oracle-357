name: B516 START FOOTER REMOVE

on:
  push:
    branches: [main]
    paths:
      - B516_START_FOOTER_REMOVE.txt
      - .github/workflows/b516-start-footer-remove.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'B516 START FOOTER REMOVED') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Freeze protected modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          for f in \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt; do
            git hash-object "$f" > "/tmp/oracle-freeze/$(basename "$f").sha"
          done

      - name: Remove Start footer only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s = p.read_text()
          old = '''        val status=LinearLayout(this).apply { orientation=LinearLayout.HORIZONTAL; gravity=Gravity.CENTER_VERTICAL; setPadding(dp(14),dp(11),dp(14),dp(11)); setBackgroundColor(Color.rgb(8,12,24)) }\n        status.addView(View(this).apply{setBackgroundColor(Color.rgb(50,220,135))},LinearLayout.LayoutParams(dp(8),dp(8)))\n        status.addView(TextView(this).apply{text=\"  ORACLE READY\";textSize=13f;typeface=Typeface.DEFAULT_BOLD;setTextColor(Color.WHITE)},LinearLayout.LayoutParams(0,-2,1f))\n        status.addView(TextView(this).apply{text=\"LOCAL INTELLIGENCE\";textSize=10f;setTextColor(Color.rgb(140,150,170))})\n        page.addView(status,LinearLayout.LayoutParams(-1,-2).apply{setMargins(0,dp(8),0,dp(8))})\n'''
          if old not in s:
              raise SystemExit('Expected Start footer block not found; aborting without changes.')
          p.write_text(s.replace(old, '', 1))
          PY

      - name: Verify only Start host changed
        run: |
          set -euo pipefail
          ! grep -q 'status.addView(TextView(this).apply{text="  ORACLE READY"' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          ! grep -q 'status.addView(TextView(this).apply{text="LOCAL INTELLIGENCE"' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q 'OracleMysticHeroView(this)' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q '357AT2026' app/src/main/java/ro/alintudor/oracle/OracleMysticStartViewV2.kt
          ! grep -q '"stock"' app/src/main/java/ro/alintudor/oracle/OracleMysticStartViewV2.kt
          git diff --check
          for f in \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt; do
            test "$(git hash-object \"$f\")" = "$(cat /tmp/oracle-freeze/$(basename \"$f\").sha)"
          done

      - name: Commit footer removal
        run: |
          git config user.name "Oracle Build Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          git commit -m "B516 START FOOTER REMOVED" || true
          git push origin HEAD:main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Set B516 version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 37', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-START-B516'", s, count=1)
          p.write_text(s)
          PY

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='V6g-START-B516'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='37'"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B516-START-NO-FOOTER
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
